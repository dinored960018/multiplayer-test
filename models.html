    .chip.on { border-color: #ffff00; color: #ffff00; }
    .chip a { color: inherit; text-decoration: none; }

    #sw i { width: 18px; height: 18px; border: 1px solid #444; cursor: pointer; display: inline-block; box-sizing: border-box; }
    #sw i.on { border: 2px solid #fff; }
    #info { position: fixed; right: 10px; bottom: 10px; background: rgba(8, 8, 12, .85); border: 1px solid #444; padding: 8px 12px; min-width: 200px; max-width: 320px; font-variant-numeric: tabular-nums; }
    #info b { color: #ffff00; display: block; margin-bottom: 2px; }
    #info small { color: #999; }
    #info table { border-collapse: collapse; margin-top: 4px; }
    #info td { padding: 0 8px 0 0; color: #ccc; }
    #help { position: fixed; left: 250px; bottom: 10px; color: #888; font-size: 12px; }
